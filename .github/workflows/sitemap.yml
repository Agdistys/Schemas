name: Generate image sitemap

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "17 3 * * *"   # 1×/jour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: |
          python scripts/generate_sitemap.py

      # ✅ Ne commit que si sitemap.xml a changé
      - name: Commit & push if sitemap.xml changed
        run: |
          if [[ -n "$(git status --porcelain -- sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: update sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml unchanged; skipping commit."
          fi
