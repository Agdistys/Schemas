<script>
  const IMG_RE=/\.(png|jpe?g|gif|svg)$/i, PDF_RE=/\.pdf$/i;

  const displayName = (url) => {
    try{
      const u = new URL(url);
      let seg = u.pathname.split('/').filter(Boolean).pop() || url;
      try{ seg = decodeURIComponent(seg); }catch{}
      try{ seg = decodeURI(seg); }catch{}
      return seg.replace(/%20/g,' ').replace(/\+/g,' ');
    }catch{ return url; }
  };

  const fetchText = async (url) => (await fetch(url,{cache:'no-store'})).text();

  // ---- Galerie (derniers ajouts réels + sélection par dossier)
  async function buildGallery(){
    const xml = await fetchText('https://agdistys.github.io/Schemas/sitemap.xml');
    const doc = new DOMParser().parseFromString(xml,'application/xml');
    const nodes = [...doc.querySelectorAll('url')];

    const byFolder = new Map(), latest=[], seen=new Set();

    nodes.forEach(n=>{
      const loc = n.querySelector('loc')?.textContent || '';
      const last = n.querySelector('lastmod')?.textContent || '';
      try{
        const u = new URL(loc);
        if(!IMG_RE.test(u.pathname)) return;
        if(!u.pathname.includes('/Schemas/')) return;
        if(seen.has(u.pathname)) return;
        seen.add(u.pathname);
        const parts = u.pathname.split('/').filter(Boolean);
        const folder = parts[1] || 'Divers';
        const item = {src:loc, name:displayName(loc), last};
        latest.push(item);
        if(!byFolder.has(folder)) byFolder.set(folder, []);
        byFolder.get(folder).push(item);
      }catch{}
    });

    latest.sort((a,b)=>parseDate(b.last)-parseDate(a.last));
