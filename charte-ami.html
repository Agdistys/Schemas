<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charte aMi — Portail (IA & Humains)</title>

  <style>
    :root{
      --bg:#0b0b0c; --card:#121214;
      --text:#9D1C6A; --gold:#E6C15A; --gold-soft:#CFA146;
      --blue:#6CAEFF;
      --sans:'Avenir Next','Avenir','Inter','Segoe UI',system-ui,Roboto,Arial,sans-serif;
      --serif:'Palatino Linotype','Book Antiqua',Palatino,serif;
    }
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);text-align:center}
    a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}

    .wrap{max-width:1100px;margin:0 auto;padding:24px}

    /* HEADER EMBED */
    .hero{display:flex;flex-direction:column;align-items:center;margin-top:20px}
    .logoRow{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
    .logoLink{display:inline-flex;align-items:center;justify-content:center; cursor:pointer}
    .logo-pupile{height:500px;width:auto}
    .amiBlock{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:260px}
    .title2{font-family:var(--serif);font-size:2.2rem;color:var(--gold);margin:0}
    .title2 a{color:var(--gold);text-decoration:none;cursor:pointer}
    .subtitle-avenir{font-size:.9rem;color:#fff;margin-top:4px;font-family:var(--sans);font-weight:400}
    .mini-links{display:flex;flex-direction:column;gap:6px;margin-top:6px}
    .mini-links a{
      font-size:.75rem;padding:4px 6px;border:1px solid var(--gold-soft);border-radius:6px;
      background:rgba(108,174,255,0.08); color:var(--blue)
    }
    .logo-ami{height:250px;width:250px;object-fit:cover;border-radius:18px;cursor:pointer}

    /* Bandeau ethos sous le header */
    .ethos{margin:22px auto 0; font-family:var(--serif); color:#fff}
    .ethos .muted{color:#f2f2f2;opacity:.85}

    /* Sections + ligne dorée sous le titre */
    .section{margin:40px 0}
    .section-title{
      font-family:var(--serif);font-size:1.7rem;color:var(--gold);margin:0 0 14px 0;position:relative;display:inline-block;padding-bottom:6px;
    }
    .section-title::after{
      content:"";display:block;width:220px;height:2px;background:var(--gold);margin:8px auto 0;border-radius:2px
    }
    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:22px auto;border:0;max-width:980px}

    /* Présentation */
    .presentation-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto}
    .presentation-bar::before,.presentation-bar::after{content:"";flex:1;height:1px;background:var(--gold-soft)}
    .presentation-title{font-family:var(--serif);color:var(--gold);font-size:1.7rem}

    /* Accès (centré) */
    .grid{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;width:260px}
    .card h3{margin:.2rem 0 .6rem 0;font-size:1.05rem;font-family:var(--serif);color:var(--gold)}

    .btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);margin:4px 0}
    .btn:hover{background:rgba(230,193,90,0.1)}

    /* Galerie scrollable (dédupliquée + cliquable) */
    #galleryViewport{
      max-height:520px;overflow-y:auto;border:1px solid var(--gold-soft);
      border-radius:14px;background:rgba(255,255,255,.02);padding:8px
    }
    #galleryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px} /* encore plus serré */
    .thumb{border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:#000}
    .thumb img{width:100%;height:130px;object-fit:cover;display:block}
    .thumb figcaption{padding:3px 6px;font-size:.76rem;color:#b9bfca;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .inlinebar{display:flex;gap:10px;justify-content:center;margin:10px 0}
    .inlinebar select{
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
      color:#fff; /* texte blanc demandé */
      padding:6px 10px;border-radius:8px;font-family:var(--serif)
    }

    /* Documents */
    #docList{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
    #docList li{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:left}
    #docList .name{font-family:var(--serif);color:var(--gold)}

    /* Certificats en bleu */
    .cert a.btn{border-color:var(--gold-soft); color:var(--blue)}
    .cert a.btn:hover{background:rgba(108,174,255,0.12)}
  </style>
</head>
