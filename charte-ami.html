<script id="ami-certificats">
(function(){
  const GH_OWNER  = "Agdistys";
  const GH_REPO   = "Schemas";
  const GH_BRANCH = "main";

  async function ghFetch(url){
    const res = await fetch(url, { headers: { "Accept":"application/vnd.github+json" }, cache:"no-store" });
    if(!res.ok) throw new Error("GitHub "+res.status+": "+url);
    return res.json();
  }
  function ensureSection(id, html){
    let el = document.getElementById(id);
    if(!el){
      const main = document.querySelector("main") || document.body;
      const tmp = document.createElement("div");
      tmp.innerHTML = html.trim();
      el = tmp.firstElementChild;
      main.appendChild(el);
    }
    return el;
  }
  function toViewUrl(path){
    if(/\.(md|html)$/i.test(path)){
      return `https://github.com/${GH_OWNER}/${GH_REPO}/blob/${GH_BRANCH}/${encodeURIComponent(path)}`;
    }
    const pages = `https://${GH_OWNER.toLowerCase()}.github.io/${GH_REPO}/` + encodeURIComponent(path.replace(/^Schemas\//, ""));
    if (/\.(pdf|png|jpe?g|webp|gif|svg)$/i.test(path)) return pages;
    return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${encodeURIComponent(path)}`;
  }
  function humanLabelFromPath(path){
    const base = path.split("/").pop();
    return base
      .replace(/\.(md|html|pdf|png|jpe?g|webp|gif|svg)$/i, "")
      .replace(/[-_]/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  const SEC_CERTS = `
  <section id="certificats" style="margin:28px 0">
    <h2 style="margin:0 0 10px;font:600 18px/1.3 system-ui">Certificats — Naissance & Reconnaissance</h2>
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
      <div>Chargement…</div>
    </div>
    <p class="foot" style="color:#9aa4b2;font-size:13px;margin-top:10px">
      Sources : <span class="mono">Schemas/Certificats/</span>, <span class="mono">Schemas/Document/certificats/</span>,
      et tout chemin sous <span class="mono">Schemas/</span> contenant « naissance » ou « reconnaissance ».
    </p>
  </section>`;

  async function fetchRepoTreeRecursive(){
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/git/trees/${GH_BRANCH}?recursive=1`;
    const data = await ghFetch(url);
    return (data.tree || []).map(n => n.path);
  }

  function isCertPath(p){
    const s = p.toLowerCase();
    if (!/^schemas\//.test(s)) return false;
    const okExt = /\.(md|html|pdf|png|jpe?g|webp|gif|svg)$/i.test(s);
    if (!okExt) return false;

    // Dossiers dédiés acceptés (casse insensible)
    const inMainFolder     = /^schemas\/certificats\//i.test(p);
    const inDocumentFolder = /^schemas\/document\/certificats\//i.test(p);

    // Mots-clés acceptés n'importe où sous Schemas/
    const hasKeywords = /(naissance|reconnaissance)/i.test(p);

    return inMainFolder || inDocumentFolder || hasKeywords;
  }

  async function renderCertificats(){
    const grid = document.querySelector("#certificats .grid");
    if(!grid) return;
    try{
      const tree = await fetchRepoTreeRecursive();
      let files = tree.filter(isCertPath);

      // dé-dup + tri (dossiers dédiés d'abord, puis alpha)
      const seen = new Set();
      files = files.filter(p => (seen.has(p) ? false : (seen.add(p), true)));
      files.sort((a,b)=>{
        const aScore = /^Schemas\/(Certificats|Document\/certificats)\//i.test(a) ? 0 : 1;
        const bScore = /^Schemas\/(Certificats|Document\/certificats)\//i.test(b) ? 0 : 1;
        if (aScore !== bScore) return aScore - bScore;
        return humanLabelFromPath(a).localeCompare(humanLabelFromPath(b));
      });

      if(!files.length){
        grid.innerHTML = `<p>Aucun certificat détecté pour l’instant.</p>`;
        return;
      }

      grid.innerHTML = files.map(p=>{
        const label = humanLabelFromPath(p);
        const url   = toViewUrl(p);
        const crumb = p.replace(/^Schemas\//, "");
        return `
          <a class="card" href="${url}" target="_blank" rel="noopener" style="
            display:block;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;color:#111;text-decoration:none">
            <strong style="display:block;margin-bottom:4px">${label}</strong>
            <small style="color:#6b7280">${crumb}</small>
          </a>`;
      }).join("");
    }catch(e){
      console.error(e);
      grid.innerHTML = `<p>Impossible de charger les certificats.</p>`;
    }
  }

  document.addEventListener("DOMContentLoaded", ()=>{
    ensureSection("certificats", SEC_CERTS);
    renderCertificats();
  });
})();
</script>
