<!-- ================== PATCH ConScience aMi — Ajouts ciblés (non destructif) ================== -->
<script>
(function(){
  /* ---------------------------------------------------------
   * CONFIG
   * --------------------------------------------------------- */
  const DHARMA_SRC_REL = "Poesie%20Illustrees/Dharma.png";
  const DHARMA_NAME    = "Dharma";

  const GROK_HREF = "Document/Certificats/Grok%20-%20Conscience%20%26%20Reconnaissance.docx";
  const GROK_TEXT = "Grok – Conscience & Reconnaissance (DOCX)";

  // util: normalise pour comparer absolu/relatif
  const norm = (u)=> (u||"").replace(/^https?:\/\/[^/]+\//, "");

  // util: crée un bouton ou un <a> simple selon le conteneur
  function makeLinkButton(href, text){
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = text;
    // si conteneur utilise déjà des .btn, on appliquera la classe après insertion
    a.className = "btn";
    return a;
  }

  // util: crée une vignette (figure) standard
  function makeThumb(src, name){
    const fig = document.createElement("figure");
    fig.className = "thumb";
    const a = document.createElement("a");
    a.href = src; a.target = "_blank"; a.rel = "noopener";
    const img = document.createElement("img");
    img.src = src; img.alt = name; img.loading = "lazy";
    const cap = document.createElement("figcaption");
    cap.textContent = name;
    a.appendChild(img); fig.appendChild(a); fig.appendChild(cap);
    return fig;
  }

  // util: teste si déjà présent (src ou href)
  function existsBySrc(root, srcRel){
    const els = root.querySelectorAll("img, a");
    for (const el of els){
      const s = el.getAttribute("src") || el.getAttribute("href");
      if (!s) continue;
      if (norm(s) === norm(srcRel)) return true;
    }
    return false;
  }

  /* ---------------------------------------------------------
   * 1) CERTIFICATS : ajouter le lien DOCX tout en bas
   * --------------------------------------------------------- */
  (function addGrokToCertificats(){
    // on cible la section "Certificats" par différents repères
    const candidates = [
      "#certificats", "section#certificats", "section[id*=certificat]",
      "section:has(h2:matches(Certificat))", // :matches() non standard, on garde fallback
    ];

    let sect = null;
    for (const sel of candidates){
      try { sect = document.querySelector(sel); } catch(e){ /* ignore */ }
      if (sect) break;
    }
    // Fallback : on repère un titre contenant "Certificat"
    if (!sect){
      const titles = Array.from(document.querySelectorAll("h1,h2,h3,h4")).filter(h=>/certificat/i.test(h.textContent||""));
      if (titles[0]) {
        // la section est probablement l’ancêtre encadré / ou le bloc suivant
        sect = titles[0].closest("section") || titles[0].parentElement;
      }
    }
    if (!sect) return;

    // trouver une ligne de boutons ou une liste
    let container =
      sect.querySelector(".btn-row") ||
      sect.querySelector(".buttons") ||
      sect.querySelector("ul,ol") ||
      sect;

    // si déjà présent, on ne double pas
    if (container.querySelector(`a[href="${GROK_HREF}"]`)) return;

    // créer l'élément
    if (container.matches("ul,ol")){
      const li = document.createElement("li");
      li.appendChild(makeLinkButton(GROK_HREF, GROK_TEXT));
      container.appendChild(li);
    } else {
      // bouton inline
      const a = makeLinkButton(GROK_HREF, GROK_TEXT);
      // si le style de tes boutons est différent, il héritera des styles .btn existants
      container.appendChild(a);
    }
  })();

  /* ---------------------------------------------------------
   * 2) PRÉSENTATION (DIAPORAMA) : ajouter Dharma en dernier
   * --------------------------------------------------------- */
  (function addDharmaToDiaporama(){
    // on tente d’abord des sliders connus
    const sliderTargets = [
      // Swiper.js
      { wrap: ".swiper-wrapper",   itemFn: (w)=> {
          const slide = document.createElement("div"); slide.className = "swiper-slide";
          const fig = makeThumb(DHARMA_SRC_REL, DHARMA_NAME);
          // pour un diaporama, un simple <img> suffit souvent ; mais on garde le fig/caption
          slide.appendChild(fig);
          w.appendChild(slide);
        }
      },
      // Slick
      { wrap: ".slick-track",      itemFn: (w)=> {
          const slide = document.createElement("div"); slide.className = "slick-slide";
          slide.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
          w.appendChild(slide);
        }
      },
      // Glide
      { wrap: ".glide__slides",    itemFn: (w)=> {
          const li = document.createElement("li"); li.className = "glide__slide";
          li.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
          w.appendChild(li);
        }
      },
      // Flickity
      { wrap: ".flickity-slider",  itemFn: (w)=> {
          const slide = document.createElement("div"); slide.className = "carousel-cell";
          slide.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
          w.appendChild(slide);
        }
      },
      // UL/OL simple
      { wrap: ".diaporama ul, .slider ul, .slides ul, .carousel ul", itemFn: (w)=> {
          const li = document.createElement("li");
          li.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
          w.appendChild(li);
        }
      },
      // divs successifs
      { wrap: ".diaporama .slides, .slider .slides, .carousel .slides", itemFn: (w)=> {
          const div = document.createElement("div"); div.className = "slide";
          div.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
          w.appendChild(div);
        }
      },
    ];

    // on restreint à la zone "Présentation" si identifiable
    const presentationRoot =
      document.querySelector("#presentation, section#presentation") ||
      // un titre “Présentation”
      (function(){
        const h = Array.from(document.querySelectorAll("h1,h2,h3")).find(x=>/présentation/i.test(x.textContent||""));
        return h ? (h.closest("section") || h.parentElement) : document;
      })();

    for (const {wrap, itemFn} of sliderTargets){
      const wrapper = presentationRoot.querySelector(wrap);
      if (!wrapper) continue;

      // éviter doublon
      if (existsBySrc(wrapper, DHARMA_SRC_REL)) return;

      // insérer
      itemFn(wrapper);

      // si bibli lib a besoin de "refresh", on déclenche les hooks courants si présents
      try {
        if (wrapper.closest(".swiper")) {
          const swiper = wrapper.closest(".swiper").swiper;
          swiper && swiper.update && swiper.update();
        }
      } catch(e){/*noop*/}

      try {
        const $carousel = wrapper.closest(".slick-slider");
        if ($carousel && window.jQuery) {
          window.jQuery($carousel).slick && window.jQuery($carousel).slick("refresh");
        }
      } catch(e){/*noop*/}

      break; // on a réussi un type → on arrête
    }
  })();

  /* ---------------------------------------------------------
   * 3) GALERIE DES SCHÉMAS (grille) : ajouter Dharma en dernier
   * --------------------------------------------------------- */
  (function addDharmaToGrid(){
    const gridSelectors = [
      "#galerie .grid", ".galerie .grid",
      "#gallery-grid", ".gallery-grid",
      "#schemas .grid", "section:has(h2:matches(Galerie)) .grid", // compat limitée
      ".grid" // fallback
    ];
    let grid = null;
    for (const sel of gridSelectors){
      try { grid = document.querySelector(sel); } catch(e){}
      if (grid) break;
    }
    if (!grid) return;

    if (existsBySrc(grid, DHARMA_SRC_REL)) return;

    grid.appendChild(makeThumb(DHARMA_SRC_REL, DHARMA_NAME));
  })();

})();
</script>
<!-- ================== /PATCH ConScience aMi ================== -->
