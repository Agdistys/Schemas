<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charte aMi — Portail (IA & Humains)</title>
  <meta name="description" content="Charte aMi — Portail unique, type linktree, pour Agdistys (IA & Humains)">
  <link rel="preconnect" href="https://agdistys.fr" crossorigin>
  <style>
    :root{
      --bg:#0b0b0c; --card:#121214; --muted:#9aa0aa; --text:#e9e9ee; --accent:#6cf0c2;
      --link:#9ad1ff; --gold:#d9c07a; --gold-soft:#cbb46d; --shadow:0 10px 30px rgba(0,0,0,.35);
      --serif:'Palatino Linotype','Book Antiqua',Palatino,'Charter','Crimson Text',serif;
      --sans:'Avenir Next','Avenir','Inter','Segoe UI',system-ui,Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 700px at 20% -10%,rgba(108,240,194,.08),transparent 60%),
        radial-gradient(900px 600px at 110% 10%,rgba(154,209,255,.08),transparent 60%),
        var(--bg);
      color:var(--text);
      font:16px/1.6 var(--sans);
    }
    a{color:var(--link);text-decoration:none;cursor:pointer}
    a:hover{text-decoration:underline}
    header{
      position:sticky;top:0;z-index:10;
      background:linear-gradient(180deg,rgba(11,11,12,.95),rgba(11,11,12,.6) 70%,transparent);
      backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(255,255,255,.04)
    }
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:48px;width:auto;border-radius:6px;box-shadow:0 0 12px rgba(0,0,0,.4);cursor:pointer}
    .h1link{display:inline-block;font-family:var(--serif);font-size:1.6rem;color:var(--gold);cursor:pointer}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
    .card h3{margin:.2rem 0 .6rem 0;font-size:1.1rem;font-family:var(--serif);color:var(--gold);text-align:center}
    .muted{color:var(--muted)}
    .btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);cursor:pointer}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .section{margin:34px 0}
    .kicker{letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:.78rem;margin-bottom:6px}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);margin:18px 0}
    footer{margin:40px 0 60px;color:var(--muted);text-align:center}

    /* Logos + tailles */
    .logoimg{height:64px;width:auto;display:block;cursor:pointer;margin-inline:auto}
    .logoimg.big{height:140px;width:auto;display:block;cursor:pointer;margin-inline:auto}
    .logoBlock{display:flex;align-items:center;gap:14px}
    .logoCaption{font-family:var(--serif);color:var(--gold-soft);text-align:center}
    .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;justify-content:center}
    .btn.primary{border-color:rgba(217,192,122,.45);background:rgba(217,192,122,.08)}
    .btn.primary:hover{background:rgba(217,192,122,.15)}

    /* Galerie (2 lignes visibles, scroll vertical) */
    #galleryViewport{
      max-height: 2*180px + 16px; /* 2 lignes de 180px + gap approx (via calc ci-dessous) */
      max-height: calc(2*180px + 16px);
      overflow-y: auto;
      border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.02);
      padding:10px;
    }
    #galleryGrid{
      display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start;
    }
    .thumb{
      width: calc(33.333% - 8px); /* 3 par ligne sur large écran */
      min-width: 260px; max-width: 360px;
      border-radius:12px; border:1px solid rgba(255,255,255,.12);
      overflow:hidden; background:#000;
    }
    .thumb img{display:block;width:100%;height:180px;object-fit:cover}
    .thumb figcaption{padding:6px 8px;font-size:.9rem;text-align:center;color:var(--muted)}

    /* Roulette PDF (ressources extérieures) */
    #pdfWheel{display:flex;gap:12px;overflow:auto;padding:6px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.02)}
    .pdfpill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);white-space:nowrap}

    /* Inputs */
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:.5rem 0 1rem}
    select, .select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:var(--text);
      padding:8px 12px;border-radius:10px}
  </style>
</head>
<body>

    <div class="wrap">
      <div class="hero">
