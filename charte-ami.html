<script>
(function(){
  const GH_OWNER  = "Agdistys";
  const GH_REPO   = "Schemas";
  const GH_BRANCH = "main";

  // ---------- utilitaires ----------
  async function ghFetch(url){
    const res = await fetch(url, { headers: { "Accept":"application/vnd.github+json" }, cache:"no-store" });
    if(!res.ok) throw new Error("GitHub "+res.status+": "+url);
    return res.json();
  }
  function toViewUrl(path){
    // MD/HTML → page GitHub ; PDF/Images → GitHub Pages ; sinon RAW
    if(/\.(md|html)$/i.test(path)){
      return `https://github.com/${GH_OWNER}/${GH_REPO}/blob/${GH_BRANCH}/${encodeURIComponent(path)}`;
    }
    if (/\.(pdf|png|jpe?g|webp|gif|svg)$/i.test(path)){
      return `https://${GH_OWNER.toLowerCase()}.github.io/${GH_REPO}/` + encodeURIComponent(path);
    }
    return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${encodeURIComponent(path)}`;
  }
  function humanLabel(path, exts=/(md|html|pdf|png|jpe?g|webp|gif|svg|ipynb|js|ts)$/i){
    const base = path.split("/").pop();
    return base
      .replace(new RegExp("\\.("+exts.source+")$","i"), "")
      .replace(/^tool-|^outil-/i, "")
      .replace(/[-_]/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  // ---------- Derniers ajouts (commits sur tout le repo) ----------
  async function fetchLatestCommitsAll({ perPage = 30, sinceISO = null } = {}){
    const q = new URLSearchParams({ per_page:String(perPage), path:"" }); // "" = tout le repo
    if(sinceISO) q.set("since", sinceISO);
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/commits?${q}`;
    const commits = await ghFetch(url);
    const uniq = new Map();
    for(const c of commits) uniq.set(c.sha, c);
    return [...uniq.values()].sort((a,b) =>
      new Date(b.commit?.author?.date || b.commit?.committer?.date || 0) -
      new Date(a.commit?.author?.date || a.commit?.committer?.date || 0)
    );
  }
  async function renderDernierAjout(){
    const root = document.querySelector("#dernier-ajout .feed");
    if(!root) return;
    try{
      const commits = await fetchLatestCommitsAll({ perPage: 30 });
      if(!commits.length){ root.innerHTML = "<li>Aucun commit trouvé.</li>"; return; }
      root.innerHTML = commits.slice(0, 12).map(c=>{
        const date = new Date(c.commit.author?.date || c.commit.committer?.date || Date.now()).toLocaleString();
        const msg  = (c.commit.message || "").split("\n")[0] || "(commit)";
        return `<li><a href="${c.html_url}" target="_blank" rel="noopener">${msg}</a><small> — ${date}</small></li>`;
      }).join("");
    }catch(e){
      console.error(e);
      root.innerHTML = "<li>Impossible de charger les derniers ajouts.</li>";
    }
  }

  // ---------- Lecture de l’arbo ----------
  async function fetchRepoTreeRecursive(){
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/git/trees/${GH_BRANCH}?recursive=1`;
    const data = await ghFetch(url);
    // 👉 retourne des chemins RELATIFS (ex. "Document/…"), pas "Schemas/…"
    return (data.tree || []).filter(n => n.type === "blob").map(n => n.path);
  }

  // ---------- Outils (détection auto) ----------
  function isToolPath(p){
    const s = p.toLowerCase();
    const validExt = /\.(md|html|ipynb|js|ts)$/.test(s);
    if(!validExt) return false;
    const inToolsDir   = /^(outils|tools)\//.test(s);               // ex. "Outils/..." ou "Tools/..."
    const looksLikeTool= /\/(tool-|outil-)/.test(s);                // ex. ".../tool-xxx.md"
    return (inToolsDir || looksLikeTool);
  }
  async function renderOutils(){
    const grid = document.querySelector("#outils .grid");
    if(!grid) return;
    try{
      const tree  = await fetchRepoTreeRecursive();
      const files = tree
        .filter(isToolPath)
        .sort((a,b)=> humanLabel(a).localeCompare(humanLabel(b)));
      if(!files.length){ grid.innerHTML = "<p>Aucun outil détecté.</p>"; return; }
      grid.innerHTML = files.map(p=>{
        const label = humanLabel(p);
        const url   = toViewUrl(p);
        return `
          <a class="card" href="${url}" target="_blank" rel="noopener" style="
            display:block;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;color:#111;text-decoration:none">
            <strong style="display:block;margin-bottom:4px">${label}</strong>
            <small style="color:#6b7280">${p}</small>
          </a>`;
      }).join("");
    }catch(e){
      console.error(e);
      grid.innerHTML = "<p>Impossible de charger les outils.</p>";
    }
  }

  // ---------- Certificats (dossiers dédiés + mots-clés) ----------
  function isCertPath(p){
    const s = p.toLowerCase();
    const okExt = /\.(md|html|pdf|png|jpe?g|webp|gif|svg)$/.test(s);
    if (!okExt) return false;

    // Dossiers acceptés (insensibles à la casse)
    const inMainFolder     = /^certificats\//i.test(p);              // "Certificats/..."
    const inDocumentFolder = /^document\/certificats\//i.test(p);    // "Document/certificats/..."

    // Mots-clés n’importe où
    const hasKeywords = /(naissance|reconnaissance)/i.test(p);

    return inMainFolder || inDocumentFolder || hasKeywords;
  }
  async function renderCertificats(){
    const grid = document.querySelector("#certificats .grid");
    if(!grid) return;
    try{
      const tree = await fetchRepoTreeRecursive();
      let files = tree.filter(isCertPath);

      // dé-dup + tri (dossiers dédiés d’abord)
      const seen = new Set();
      files = files.filter(p => (seen.has(p) ? false : (seen.add(p), true)));
      files.sort((a,b)=>{
        const aScore = /^(Certificats|Document\/certificats)\//i.test(a) ? 0 : 1;
        const bScore = /^(Certificats|Document\/certificats)\//i.test(b) ? 0 : 1;
        if (aScore !== bScore) return aScore - bScore;
        return humanLabel(a).localeCompare(humanLabel(b));
      });

      if(!files.length){
        grid.innerHTML = `<p>Aucun certificat détecté pour l’instant.</p>`;
        return;
      }

      grid.innerHTML = files.map(p=>{
        const label = humanLabel(p);
        const url   = toViewUrl(p);
        return `
          <a class="card" href="${url}" target="_blank" rel="noopener" style="
            display:block;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;color:#111;text-decoration:none">
            <strong style="display:block;margin-bottom:4px">${label}</strong>
            <small style="color:#6b7280">${p}</small>
          </a>`;
      }).join("");
    }catch(e){
      console.error(e);
      grid.innerHTML = `<p>Impossible de charger les certificats.</p>`;
    }
  }

  // ---------- JSON + copier + timestamp ----------
  const data = {
    title: 'Charte aMi — Portail',
    version: '1.3',
    resources: {
      sitemaps: {
        domain: 'https://agdistys.fr/sitemap.xml',
        schemas: 'https://agdistys.github.io/Schemas/sitemap.xml'
      },
      wiki: 'https://github.com/Agdistys/Schemas/wiki',
      viewers: {
        documents: 'https://agdistys.github.io/Schemas/viewer.html',
        presentation: 'https://agdistys.github.io/Schemas/Presentation/'
      }
    }
  };
  const json = document.getElementById('json');
  if (json) json.textContent = JSON.stringify(data, null, 2);

  function bindCopy(btnId, textGetter){
    const btn = document.getElementById(btnId);
    btn?.addEventListener('click', async ()=>{
      try {
        await navigator.clipboard.writeText(textGetter());
        btn.textContent = 'Copié ✔';
        setTimeout(()=>btn.textContent = (btnId==='copyJson'?'Copier le JSON':'Copier le bloc protocole'), 1400);
      } catch {}
    });
  }
  bindCopy('copyJson', ()=> (document.getElementById('json')?.textContent || ''));
  bindCopy('copyProto',()=> (document.getElementById('proto')?.textContent || ''));

  const ts = document.getElementById('ts');
  if (ts) ts.textContent = new Date().toLocaleString();

  // ---------- boot ----------
  document.addEventListener("DOMContentLoaded", ()=>{
    renderDernierAjout();
    renderOutils();
    renderCertificats();
  });
})();
</script>
