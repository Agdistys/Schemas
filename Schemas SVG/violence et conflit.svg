    <text class="cls-8" transform="translate(86.29 457.99)"><tspan class="cls-37"><tspan class="cls-20" x="0" y="0">L&apos;ag</tspan><tspan class="cls-21" x="35.68" y="0">r</tspan><tspan class="cls-20" x="41.92" y="0">esseur conçoit la vic</tspan><tspan class="cls-16" x="209.63" y="0">t</tspan><tspan class="cls-20" x="216.23" y="0">ime, </tspan><tspan class="cls-39" x="257.44" y="0">la femme</tspan><tspan class="cls-20" x="335.02" y="0">, comme </tspan></tspan><tspan class="cls-19"><tspan x="-9.68" y="22.44">une part de lui-meme à domine</tspan><tspan class="cls-46" x="255.32" y="22.44">r</tspan><tspan x="260.18" y="22.44">, à maitriser et non </tspan></tspan><tspan class="cls-19"><tspan x="9.84" y="44.88">comme une en</tspan><tspan class="cls-22" x="134.6" y="44.88">t</tspan><tspan x="141.2" y="44.88">ité p</tspan><tspan class="cls-43" x="179.29" y="44.88">r</tspan><tspan x="185.53" y="44.88">op</tspan><tspan class="cls-43" x="208.07" y="44.88">r</tspan><tspan x="214.31" y="44.88">e à chérir et soutenir : </tspan></tspan><tspan class="cls-19"><tspan x="101.34" y="67.31">laisser viv</tspan><tspan class="cls-43" x="180.64" y="67.31">r</tspan><tspan x="186.89" y="67.31">e &amp; p</tspan><tspan class="cls-43" x="232.61" y="67.31">r</tspan><tspan x="238.85" y="67.31">ospé</tspan><tspan class="cls-43" x="279.75" y="67.31">r</tspan><tspan x="285.99" y="67.31">e</tspan><tspan class="cls-46" x="296.39" y="67.31">r</tspan><tspan x="301.25" y="67.31">.</tspan></tspan><tspan class="cls-17"><tspan x="35.88" y="112.19">A</tspan><tspan class="cls-22" x="49.05" y="112.19">t</tspan><tspan x="55.65" y="112.19">teinte à </tspan><tspan class="cls-22" x="124.59" y="112.19">l</tspan><tspan x="129.09" y="112.19">&apos;intégrité physique et morale </tspan></tspan><tspan class="cls-17"><tspan x="19.56" y="134.63">- cont</tspan><tspan class="cls-43" x="68.08" y="134.63">r</tspan><tspan x="74.33" y="134.63">ole de la situa</tspan><tspan class="cls-22" x="191.06" y="134.63">t</tspan><tspan x="197.66" y="134.63">ion par une personne - </tspan></tspan><tspan class="cls-17"><tspan x="11.28" y="157.07">emprise - peur - insécurité - tension constante </tspan></tspan><tspan class="cls-17"><tspan x="61.16" y="179.51">- but destructeur sur sa partenai</tspan><tspan class="cls-43" x="329.99" y="179.51">r</tspan><tspan x="336.23" y="179.51">e </tspan></tspan><tspan class="cls-17"><tspan x="2.26" y="201.94">- les violences s&apos;accumulent et s&apos;accelè</tspan><tspan class="cls-43" x="327.22" y="201.94">r</tspan><tspan x="333.47" y="201.94">ent dans </tspan></tspan><tspan class="cls-17"><tspan x="102.22" y="224.38">«le cycle des violences».</tspan></tspan><tspan class="cls-17"><tspan x="115.52" y="246.82">Béton : Pas Ques</tspan><tspan class="cls-22" x="259.68" y="246.82">t</tspan><tspan x="266.28" y="246.82">ion</tspan></tspan><tspan class="cls-36"><tspan x="78.47" y="291.7">Les mé</tspan><tspan class="cls-22" x="137.7" y="291.7">d</tspan><tspan x="149.15" y="291.7">ia</tspan><tspan class="cls-22" x="163.34" y="291.7">t</tspan><tspan x="169.94" y="291.7">ions sont inte</tspan><tspan class="cls-43" x="282.2" y="291.7">r</tspan><tspan class="cls-22" x="288.45" y="291.7">d</tspan><tspan x="299.89" y="291.7">ites </tspan></tspan><tspan class="cls-36"><tspan x="36.9" y="314.13">car les ag</tspan><tspan class="cls-43" x="116.57" y="314.13">r</tspan><tspan x="122.82" y="314.13">esseurs ne pensent qu&apos;à eux :</tspan></tspan><tspan class="cls-36"><tspan x="77.44" y="336.57">aucun comp</tspan><tspan class="cls-43" x="180.02" y="336.57">r</tspan><tspan x="186.26" y="336.57">omis est possible</tspan></tspan></text>
    <text class="cls-8" transform="translate(706.93 475.01)"><tspan class="cls-3"><tspan x="0" y="0">Les deux sont des entités </tspan></tspan><tspan class="cls-3"><tspan x="-.35" y="22.44">reconnues à part entière.</tspan></tspan><tspan class="cls-17"><tspan x="12.16" y="134.63">Négocia</tspan><tspan class="cls-22" x="82.84" y="134.63">t</tspan><tspan x="89.44" y="134.63">ion - Ecoute</tspan></tspan><tspan class="cls-17"><tspan x="-17.27" y="157.07">Débat - Remise en Ques</tspan><tspan class="cls-22" x="187.46" y="157.07">t</tspan><tspan x="194.07" y="157.07">ion</tspan></tspan><tspan class="cls-17"><tspan x="3" y="179.51">Apaisement </tspan><tspan class="cls-52" x="108.65" y="179.51">r</tspan><tspan x="114.9" y="179.51">écip</tspan><tspan class="cls-51" x="150.22" y="179.51">r</tspan><tspan x="156.46" y="179.51">oque</tspan></tspan><tspan class="cls-29"><tspan x="17.73" y="291.7">Ce schéma est juste </tspan></tspan><tspan class="cls-29"><tspan x="-55.76" y="314.13">une aut</tspan><tspan class="cls-52" x="7.31" y="314.13">r</tspan><tspan x="13.56" y="314.13">e </tspan><tspan class="cls-51" x="29.16" y="314.13">r</tspan><tspan x="35.4" y="314.13">ep</tspan><tspan class="cls-52" x="57.22" y="314.13">r</tspan><tspan x="63.47" y="314.13">ésenta</tspan><tspan class="cls-22" x="118.91" y="314.13">t</tspan><tspan x="125.51" y="314.13">ion du yin yang.</tspan></tspan></text>
