    <text class="cls-3" transform="translate(257.83 62.18)"><tspan class="cls-9" x="0" y="0">La </tspan><tspan class="cls-7" x="39.16" y="0">V</tspan><tspan class="cls-9" x="56.7" y="0">ie est un Jeu.</tspan><tspan class="cls-9" x="-78.85" y="34.43">Maltraiter la </tspan><tspan class="cls-7" x="93.01" y="34.43">V</tspan><tspan class="cls-9" x="110.55" y="34.43">ie c’est le Déni.</tspan><tspan class="cls-9" x="-104" y="68.87">Maltraiter la </tspan><tspan class="cls-7" x="67.86" y="68.87">V</tspan><tspan class="cls-9" x="85.4" y="68.87">ie n’est pas un Jeu.</tspan><tspan class="cls-9" x="-56.37" y="103.3">Jouer est dans Le </tspan><tspan class="cls-6" x="178.11" y="103.3">R</tspan><tspan class="cls-8" x="196.2" y="103.3">espect.</tspan><tspan class="cls-9" x="-214.63" y="137.73">Sinon c’est Maltraite</tspan><tspan class="cls-5" x="53.41" y="137.73">r</tspan><tspan class="cls-9" x="61.79" y="137.73">, Oppresse</tspan><tspan class="cls-5" x="198.15" y="137.73">r</tspan><tspan class="cls-8" x="206.53" y="137.73">, dans la </tspan><tspan class="cls-7" x="325.32" y="137.73">V</tspan><tspan class="cls-8" x="342.86" y="137.73">iolence.</tspan></text>
