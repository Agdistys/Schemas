    <text class="cls-6" transform="translate(637.17 106.25)"><tspan x="0" y="0">Le Respect est la Base de </tspan><tspan class="cls-29" x="591.93" y="0">T</tspan><tspan x="614.15" y="0">out</tspan></text>
    <text class="cls-1" transform="translate(461.66 1021.75)"><tspan x="0" y="0">La Justice n’est pas une Opinion qu’on se fait,</tspan><tspan x="279.93" y="57.6">C’est un Etat de Fait.</tspan></text>
    <text class="cls-19" transform="translate(353.33 839.65)"><tspan x="0" y="0">Violence</tspan></text>
    <text class="cls-5" transform="translate(1351.44 836.92)"><tspan class="cls-31" x="0" y="0">R</tspan><tspan x="43.1" y="0">espect</tspan></text>
    <text class="cls-15" transform="translate(1204.16 265.87)"><tspan x="0" y="0">opinion</tspan></text>
    <text class="cls-15" transform="translate(1412.58 265.87)"><tspan x="0" y="0">opinion</tspan></text>
    <text class="cls-15" transform="translate(1620.99 265.87)"><tspan x="0" y="0">opinion</tspan></text>
    <text class="cls-12" transform="translate(813.77 889.33)"><tspan x="0" y="0">Choix que chacun.e fait.</tspan><tspan x="-223.34" y="36.68">Il su</tspan><tspan class="cls-30" x="-168.45" y="36.68">f</tspan><tspan x="-158.82" y="36.68">fit d’une seule personne violente pour tout bloque</tspan><tspan class="cls-28" x="539.36" y="36.68">r</tspan><tspan x="547.86" y="36.68">.</tspan></text>
    <text class="cls-8" transform="translate(699.68 164.87)"><tspan x="0" y="0">Pas de Respect = pas d’évolution</tspan></text>
    <text class="cls-13" transform="translate(1237.3 500.71)"><tspan class="cls-26"><tspan x="0" y="0">s’en suit les sujets sur lesquels</tspan></tspan><tspan class="cls-26"><tspan x="-16.72" y="43.2">on peut discuter ouvertement et </tspan></tspan><tspan class="cls-7"><tspan x="-66.94" y="86.4">on grandit, on évolue ensemble,</tspan></tspan><tspan class="cls-7"><tspan x="-41.23" y="129.6">on s’apprend, on se découvre</tspan></tspan></text>
    <text class="cls-14" transform="translate(365.97 471.63)"><tspan class="cls-4" x="0" y="0">Ca boucle </tspan><tspan class="cls-16" x="177.98" y="0">:</tspan><tspan class="cls-16" x="-90.4" y="43.2">s’en suit un schéma de</tspan><tspan class="cls-4" x="278.38" y="43.2"> </tspan><tspan class="cls-4" x="-132.95" y="86.4">domination et soumission</tspan><tspan class="cls-16" x="300.92" y="86.4" xml:space="preserve"> :</tspan><tspan class="cls-4"><tspan x="-10.33" y="129.6">c’est bloqué </tspan></tspan><tspan class="cls-16" x="-131.69" y="172.8">car la personne est </tspan><tspan class="cls-4" x="187.09" y="172.8">fe</tspan><tspan class="cls-2" x="221.07" y="172.8">r</tspan><tspan class="cls-4" x="236.37" y="172.8">mée. </tspan></text>
